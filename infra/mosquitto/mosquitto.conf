# Local development broker: single plain-TCP listener, no auth (out of scope).
listener 21883 127.0.0.1
allow_anonymous true
persistence false
max_queued_messages 1000000
# The service acknowledges a message only after its batch commits, so this window must cover
# several batches (1000 each) or the broker idles during every commit. The service's own queue
# bound (INGEST_QUEUE_MAX, 10000) still applies on top.
max_inflight_messages 10000
log_dest stdout
log_type error
log_type warning
