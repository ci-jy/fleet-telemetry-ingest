# Broker for the fault-injection environment. Unlike the development broker it persists sessions
# and queued messages, so a restart keeps everything that was acknowledged to publishers.
listener 21884 127.0.0.1
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
autosave_interval 5
max_queued_messages 500000
# Larger than the service's queue bound, so a stalled service exercises its own backpressure.
max_inflight_messages 5000
log_dest stdout
log_type error
log_type warning
