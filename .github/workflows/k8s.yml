name: Kubernetes

on:
  push:
  pull_request:

concurrency:
  group: k8s-${{ github.ref }}
  cancel-in-progress: true

env:
  K3D_VERSION: v5.8.3
  HELM_VERSION: v3.16.3
  KUBECONFORM_VERSION: v0.6.7
  PROMETHEUS_VERSION: 2.55.1

jobs:
  checks:
    name: Lint, unit tests, image build, chart and rule checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit && npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Docker build
        run: docker build -t fleet-telemetry-ingest:k8s .
      - name: Install helm, kubeconform, promtool
        run: |
          curl -fsSL https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz | tar xz -C /tmp && sudo install /tmp/linux-amd64/helm /usr/local/bin/
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz | tar xz -C /tmp && sudo install /tmp/kubeconform /usr/local/bin/
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz | tar xz -C /tmp && sudo install /tmp/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool /usr/local/bin/
      - name: helm lint
        run: helm lint charts/telemetry -f charts/telemetry/values-ci.yaml
      - name: kubeconform (CI values, and every optional component enabled)
        run: |
          helm template t charts/telemetry -f charts/telemetry/values-ci.yaml | kubeconform -strict -ignore-missing-schemas -summary
          helm template t charts/telemetry --set grafana.enabled=true,e2e.enabled=true | kubeconform -strict -ignore-missing-schemas -summary
      - name: promtool
        run: |
          promtool check rules deploy/prometheus/rules.yaml
          promtool test rules deploy/prometheus/rules.test.yaml

  k3d-chaos:
    name: k3d chaos suite (pod kill, scale 1-3-2, broker and database restart)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install k3d, kubectl, helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=${K3D_VERSION} bash
          curl -fsSL https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz | tar xz -C /tmp && sudo install /tmp/linux-amd64/helm /usr/local/bin/
          kubectl version --client
      - name: Run the chaos suite on k3d
        run: bash scripts/k8s-e2e.sh --quick
      - name: Upload chaos report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-chaos-report
          path: |
            reports/k8s-chaos.json
            reports/k8s-logs/
          if-no-files-found: ignore
